<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#112236"/>
      <stop offset="60%" stop-color="#0B1524"/>
      <stop offset="100%" stop-color="#060A13"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#19C37D"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="6" y="6" width="500" height="500" rx="112" fill="url(#bgGrad)" stroke="#19C37D" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Halo de resplandor esmeralda suave detrás del check -->
  <circle cx="236" cy="256" r="130" fill="#10B981" opacity="0.10" filter="url(#softGlow)"/>

  <!-- Grupo Isotipo Sound-Check Centrado -->
  <g transform="translate(256, 256) scale(0.96) translate(-256, -256)">
    <!-- Checkmark elegante y continuo -->
    <path d="M110 255 L198 343 L348 165" 
          stroke="url(#brandGrad)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>

    <!-- Onda interior acústica -->
    <path d="M380 198 C406 226 406 274 380 302" 
          stroke="#19C37D" 
          stroke-width="26" 
          stroke-linecap="round"
          fill="none"/>

    <!-- Onda exterior acústica -->
    <path d="M430 162 C472 214 472 286 430 338" 
          stroke="#00E5FF" 
          stroke-width="26" 
          stroke-linecap="round"
          stroke-opacity="0.9"
          fill="none"/>
  </g>
</svg>