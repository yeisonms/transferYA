<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#04060B"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="60%" stop-color="#00D26A"/>
      <stop offset="100%" stop-color="#00A854"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>
  
  <!-- Subtle Internal Grid Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(0, 210, 106, 0.12)" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Electric Emerald Bolt -->
  <path d="M 285 70 L 155 265 L 245 265 L 225 442 L 357 245 L 267 245 Z" 
        fill="url(#boltGrad)" 
        filter="url(#emeraldGlow)"/>
</svg>
